[project]
name = "ant-captcha-model-server"
version = "0.1.0"
description = "Ant-Captcha 自建推理服务（FastAPI + ddddocr）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "ddddocr>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
