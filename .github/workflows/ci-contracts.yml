name: CI Contracts

# 契约是两端的唯一共识：变更必须通过实现对齐校验
on:
  push:
    paths:
      - "contracts/**"
      - "services/model-server/app/**"
  pull_request:
    paths:
      - "contracts/**"
      - "services/model-server/app/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/model-server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12"
      - name: 校验 YAML 语法
        run: python -c "import yaml; yaml.safe_load(open('../../contracts/openapi.yaml', encoding='utf-8')); print('openapi.yaml YAML OK')"
      - name: 契约 ↔ FastAPI 路由对齐
        run: |
          uv sync
          uv run python scripts/contract_check.py
