name: CI Python

on:
  push:
    paths:
      - "services/model-server/**"
      - "contracts/**"
  pull_request:
    paths:
      - "services/model-server/**"
      - "contracts/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/model-server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12"
      - run: uv sync
      - run: uv run pytest -q -p no:cacheprovider
