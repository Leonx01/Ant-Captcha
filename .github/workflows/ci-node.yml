name: CI Node

on:
  push:
    paths:
      - "apps/api-server/**"
      - "contracts/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/api-server/**"
      - "contracts/**"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # workspace lockfile 在根目录，安装必须在根目录执行
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ant-captcha/api-server build
      - run: pnpm --filter @ant-captcha/api-server test
